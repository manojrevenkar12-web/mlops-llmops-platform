[project]
name = "paved"
version = "1.0.0"
description = "One self-service release path for classical ML models and LLM agents: contract, offline gates, shadow, sequential canary with rollback, cost per team, on SageMaker, Bedrock and LangGraph"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "pyyaml>=6", "numpy>=1.26", "pandas>=2.1", "lightgbm>=4.3", "langgraph>=0.2",
  "boto3>=1.35", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
paved = "paved.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "E731", "SIM102", "SIM105", "SIM108", "B905", "RUF012", "B008"]
