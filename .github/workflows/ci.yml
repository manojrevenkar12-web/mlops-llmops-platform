name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests scripts && ruff check src tests scripts
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: held-out lock still verifies
        run: python scripts/lock.py verify
        env:
          PYTHONPATH: src
      - name: generated reports are up to date
        run: |
          python scripts/cost_report.py
          python scripts/report.py
          git diff --exit-code RESULTS.md web/public/data/dashboard.json reports/cost.json
        env:
          PYTHONPATH: src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src test
      - run: npx vitest run
      - run: npx vite build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paved:ci .
      - run: docker run --rm paved:ci paved validate workloads/pricing-conversion/workload.yaml
